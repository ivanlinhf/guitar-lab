# Guitar Lab — Windows CI
#
# Builds the Tauri desktop release on GitHub-hosted Windows runners.
# Triggers: push/PR to main, and manual workflow_dispatch.
# Tests run before the release build; a failed test short-circuits the job.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job: Vitest → Tauri release build → upload installers.
  # Sequential steps so a test failure never produces a green release artifact.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Tauri release
        run: npm run tauri build

      # With bundle.targets "all", Windows produces MSI + NSIS installers.
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: guitar-lab-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
