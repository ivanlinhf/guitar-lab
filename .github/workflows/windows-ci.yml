# Guitar Lab — Windows CI
#
# Builds the Tauri desktop release on GitHub-hosted Windows runners.
# Triggers: push/PR to main, and manual workflow_dispatch.
# Tests run before the release build; a failed test short-circuits the job.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job: Vitest → Tauri release build → upload MSI + portable exe.
  # Sequential steps so a test failure never produces a green release artifact.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Tauri release
        run: npm run tauri build

      # MSI installer (WiX). productName "Guitar Lab" names the .msi / Start Menu;
      # the installed binary is mainBinaryName "GuitarLab" → GuitarLab.exe.
      # Not uploaded: bundle/nsis/*.exe (NSIS setup installer).
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: guitar-lab-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      # Portable exe — run without install. Emitted by tauri build after renaming
      # the Cargo binary via top-level mainBinaryName "GuitarLab".
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: guitar-lab-windows-portable
          path: src-tauri/target/release/GuitarLab.exe
          if-no-files-found: error
          retention-days: 14
